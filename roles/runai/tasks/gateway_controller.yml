---
# Gateway API CRDs + KGateway controller. Installed only if missing, and marked so
# uninstall removes exactly what this role added (never a pre-existing install).
- name: Look for existing Gateway API CRDs
  ansible.builtin.shell: >-
    set -o pipefail;
    {{ runai_kubectl }} get crd --output name | grep -E '\.gateway\.networking\.k8s\.io$' || true
  args:
    executable: /bin/bash
  register: runai_gw_crds_before
  changed_when: false
  check_mode: false

- name: Install the Gateway API CRDs (standard channel, pinned)
  ansible.builtin.command: "{{ runai_kubectl }} apply --filename {{ runai_gateway_api_crds_url }}"
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
  register: runai_gw_crds_apply
  changed_when: true
  when: runai_gw_crds_before.stdout_lines | length == 0

- name: Mark the CRDs this role installed
  ansible.builtin.shell: >-
    set -o pipefail;
    {{ runai_kubectl }} get crd --output name | grep -E '\.gateway\.networking\.k8s\.io$'
    | xargs -r -I{} {{ runai_kubectl }} annotate --overwrite {} deepops.nvidia.com/runai-installed=true
  args:
    executable: /bin/bash
  changed_when: true
  when: runai_gw_crds_apply is not skipped

- name: Look for existing KGateway releases
  ansible.builtin.command: "{{ runai_helm }} list --all --namespace {{ runai_gateway_controller_namespace }} --output json"
  register: runai_gw_helm_before
  changed_when: false
  check_mode: false
  when: runai_gateway_install_controller | bool

- name: Note existing KGateway releases
  ansible.builtin.set_fact:
    runai_gw_releases_before: "{{ runai_gw_helm_before.stdout | from_json | map(attribute='name') | list }}"
  when: runai_gateway_install_controller | bool

- name: Install missing or role-owned KGateway releases
  ansible.builtin.include_tasks: gateway_release.yml
  loop: [kgateway-crds, kgateway]
  loop_control:
    loop_var: runai_gw_release
  when: runai_gateway_install_controller | bool
