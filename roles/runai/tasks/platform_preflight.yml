---
- name: Find the default storage class
  ansible.builtin.command: "{{ runai_kubectl }} get storageclass --output json"
  register: runai_sc
  changed_when: false
  check_mode: false

- name: List default storage classes
  ansible.builtin.set_fact:
    runai_default_sc: "{{ runai_sc.stdout | runai_default_storageclasses }}"

- name: Require a default storage class (the control plane needs persistent volumes)
  ansible.builtin.assert:
    that:
      - runai_default_sc | length > 0
    fail_msg: >-
      No default StorageClass. Run playbooks/k8s-cluster/nfs-client-provisioner.yml (DeepOps) or
      mark a site StorageClass as default, then rerun.
    quiet: true

- name: Find kube-prometheus-stack
  ansible.builtin.set_fact:
    runai_prom_chart: "{{ (runai_releases | selectattr('chart', 'match', '^kube-prometheus-stack-') | map(attribute='chart') | list | first) | default('') }}"

- name: Require kube-prometheus-stack at the version Run:ai needs
  ansible.builtin.assert:
    that:
      - runai_prom_chart | length > 0
      - runai_prom_chart | regex_replace('^kube-prometheus-stack-', '') is version(runai_platform_prometheus_min_version, '>=')
    fail_msg: >-
      Run:ai 3.0 needs kube-prometheus-stack {{ runai_platform_prometheus_min_version }} or newer
      (found: {{ runai_prom_chart | default('none', true) }}). Install it with scripts/k8s/deploy_monitoring.sh
      using HELM_PROMETHEUS_CHART_VERSION={{ runai_platform_prometheus_min_version }} or newer.
    quiet: true
