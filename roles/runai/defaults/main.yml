---
# Optional Run:ai / KAI Scheduler support for the DeepOps Kubernetes path.
# Off by default. Playbook: playbooks/k8s-cluster/runai.yml
# Docs: docs/k8s-cluster/runai.md   Validator: scripts/validation/validate_runai.py
#
# Modes are mutually exclusive. Never run standalone KAI and the Run:ai cluster
# chart together: the cluster chart ships its own KAI Scheduler.
#   off      do nothing (default)
#   kai      KAI Scheduler only: queues, gang scheduling, fractional GPU requests
#   platform Run:ai control plane + cluster (UI, API, projects, quotas); needs
#            more infrastructure, see docs. Experimental in 26.11.
runai_mode: "off"

# present installs/updates; absent removes everything this role installed.
runai_state: "present"

runai_helm: /usr/local/bin/helm
runai_kubectl: kubectl
runai_helm_timeout: "20m"
# Require at least one node advertising nvidia.com/gpu before installing.
runai_require_gpu: true
runai_work_dir: "{{ deepops_dir | default('/opt/deepops') }}/runai"

# ---------------------------------------------------------------- KAI Scheduler
# Pinned chart (v0.18 is a long-term-support line). No "latest".
runai_kai_chart: "oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler"
runai_kai_chart_version: "v0.18.5"
runai_kai_release_name: "kai-scheduler"
runai_kai_namespace: "kai-scheduler"

# Hard per-pod GPU-memory limits via the gpu-fractioning operator (bundled in the
# KAI chart). Opt in only. It needs GPU Operator >= v26.7.1 with an r615+ driver
# container, which the GPU Operator does not pick by default, so the role refuses
# to run until you have set those yourself (see docs). The default driver is
# never changed by this role.
runai_kai_gpu_fractioning: false
runai_gpu_operator_min_version: "v26.7.1"
runai_gpu_fractioning_min_driver_major: 615

# Extra Helm values merged over the role's values (advanced).
runai_kai_extra_values: {}

# ------------------------------------------------------------------- platform
runai_cp_chart: "control-plane"
runai_cluster_chart: "runai-cluster"
runai_chart_repo: "https://helm.ngc.nvidia.com/nvidia/runai-oss"
runai_chart_version: "3.0.20"
runai_cp_release_name: "runai-backend"
runai_cp_namespace: "runai-backend"
runai_cluster_release_name: "runai-cluster"
runai_cluster_namespace: "runai"
runai_cluster_name: "deepops"

# Fully qualified name the control plane is served on. Required in platform mode.
# For QA without DNS, use a name resolved through a hosts-file entry (see below).
runai_platform_domain: ""

# First administrator. Put the password in an Ansible vault; the role refuses an
# empty value and never prints it.
runai_platform_admin_user: "admin@example.com"
runai_platform_admin_password: ""

# Ingress. ingress-nginx was retired upstream, so platform mode installs the
# HAProxy controller that the Run:ai documentation uses, scoped to this role.
# Set to false when the site already runs an ingress controller of the class below.
runai_platform_install_ingress: true
runai_platform_ingress_class: "haproxy"
runai_platform_ingress_chart: "kubernetes-ingress"
runai_platform_ingress_repo: "https://haproxytech.github.io/helm-charts"
runai_platform_ingress_chart_version: "1.54.2"
runai_platform_ingress_release_name: "haproxy-kubernetes-ingress"
runai_platform_ingress_namespace: "haproxy-controller"
# LoadBalancer works with the DeepOps MetalLB path. NodePort suits a lab.
runai_platform_ingress_service_type: "LoadBalancer"
# Single-node labs without a load balancer: serve 80/443 directly on the node.
runai_platform_ingress_host_ports: false

# TLS. Leave the file paths empty to generate a local CA and a certificate for the
# domain (lab use). For real sites supply a certificate, key and, if privately
# signed, the CA chain; all three are paths on the first control-plane host.
runai_platform_tls_cert_file: ""
runai_platform_tls_key_file: ""
runai_platform_ca_file: ""

# Lab convenience, all off by default. Use when the domain has no DNS record.
# Address the domain should point at (default: this host's primary address).
runai_platform_ingress_ip: "{{ ansible_default_ipv4.address | default('') }}"
# Add "<ingress ip> <domain>" to /etc/hosts on the control-plane host.
runai_platform_manage_hosts_entry: false
# Make the domain resolve inside the cluster (CoreDNS rewrite to the ingress
# service). Reverted on uninstall.
runai_platform_coredns_rewrite: false

# kube-prometheus-stack is a prerequisite that DeepOps installs separately
# (scripts/k8s/deploy_monitoring.sh). Run:ai 3.0 needs this chart version or newer.
runai_platform_prometheus_min_version: "88.6.5"

# Extra Helm values merged over the role's values (advanced).
runai_platform_cp_extra_values: {}
runai_platform_cluster_extra_values: {}

# Remove the CRDs these charts leave behind when uninstalling.
runai_uninstall_remove_crds: false
