---
- name: write configuration
  import_tasks: config.yml

- name: install python3 docker module
  package:
    name: python3-docker
    state: present

- name: create a persistent docker volume for Alloy position data
  docker_volume:
    name: deepops_alloy_data
    state: present

- name: install systemd unit file
  template:
    src: docker.alloy.service.j2
    dest: "/etc/systemd/system/{{ alloy_svc_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart alloy

- name: configure service
  systemd:
    name: "{{ alloy_svc_name }}"
    state: "{{ alloy_state }}"
    enabled: "{{ alloy_enabled }}"
    daemon_reload: yes
  tags:
    - molecule-notest
