slurm_install_pyxis: true
slurm_install_prefix: /usr/local
slurm_config_dir: /etc/slurm
slurm_pyxis_version: 0.11.1
slurm_pyxis_tarball_url: "https://github.com/NVIDIA/pyxis/archive/v{{ slurm_pyxis_version }}.tar.gz"

is_controller: no
is_compute: no

pyxis_ubuntu_deps:
- "bsdmainutils"
- "apparmor"

pyxis_el_deps:
- "util-linux"

# Ubuntu restricts unprivileged user namespaces when this kernel knob exists.
# Install a command-scoped AppArmor profile instead of weakening the host-wide
# setting. Disable only when site policy supplies an equivalent profile.
pyxis_configure_enroot_apparmor_userns: true

# /run is default partition of pyxis runtime_path
resize_run_partition: false

# /run tmpfs size. ubuntu default is 10% of physical memory
pyxis_run_tmpfs_size: 50%
