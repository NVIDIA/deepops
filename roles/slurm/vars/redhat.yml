# Installed only when slurm_build_lua is enabled.
slurm_lua_deps:
  - lua-devel

slurm_pmix_deps:
  - "@Development Tools"
  - libev-devel
  - libevent-devel
  - zlib
  - zlib-devel

slurm_hwloc_deps:
  - "@Development Tools"
