---
- name: Validate the requested mode
  ansible.builtin.assert:
    that:
      - nvsentinel_mode in ['observe', 'cordon', 'drain', 'remediate']
    fail_msg: "nvsentinel_mode must be observe, cordon, drain, or remediate."

# Check the request, not the effective mode: a one-node fallback must not hide
# an unsafe request that would become active when another GPU node joins.
- name: Require explicit permission for node reboot
  ansible.builtin.assert:
    that:
      - nvsentinel_mode != 'remediate' or (nvsentinel_allow_node_reboot | bool)
    fail_msg: "remediate requires nvsentinel_allow_node_reboot: true; it can reboot nodes."

- name: Refuse remediation with dry-run
  ansible.builtin.assert:
    that:
      - nvsentinel_mode != 'remediate' or not (nvsentinel_dry_run | bool)
    fail_msg: "remediate cannot use dry-run: janitor has no dry-run support."

- name: Validate the optional GPU node count override
  ansible.builtin.assert:
    that:
      - nvsentinel_gpu_node_count is none or (nvsentinel_gpu_node_count | string is match('^[1-9][0-9]*$'))
    fail_msg: "GPU node count override nvsentinel_gpu_node_count must be a positive integer."

- name: Validate database and breaker settings
  ansible.builtin.assert:
    that:
      - nvsentinel_db_members | string in ['1', '3']
      - nvsentinel_storage_class | length > 0
      - nvsentinel_breaker_percentage == '' or (nvsentinel_breaker_percentage | string is match('^[1-9][0-9]*$') and nvsentinel_breaker_percentage | int <= 100)
    fail_msg: "Use 1 or 3 database members, a nonempty storage class, and a breaker percentage from 1 through 100 (or empty for automatic)."
