---
nvsentinel_enabled: true
# observe | cordon | drain | remediate
nvsentinel_mode: cordon
# Permit the requested mode on a single GPU node instead of falling back to observe.
# Does not bypass reboot permission or dry-run guards.
nvsentinel_mode_force: false
nvsentinel_allow_node_reboot: false
nvsentinel_dry_run: false
# Null discovers nodes from the live nvidia.com/gpu.present=true label.
nvsentinel_gpu_node_count: null
nvsentinel_db_members: 1
# Fresh database volumes only. Requires Linux < 6.19.0 or > 7.0.13.
# The chart accepts tag@digest; keep the default image immutable.
nvsentinel_db_image_tag: "8.0.34-15@sha256:e1004538c31619ec471aa39423ef9ffa39a598750661c2d6c66d785de852d538"
nvsentinel_priority_class: ""
nvsentinel_breaker_percentage: ""
nvsentinel_breaker_duration: "5m"
# Kubernetes label selectors: matchLabels and/or matchExpressions.
nvsentinel_janitor_extra_exclusions: []
# Optional nvsentinel_assume_driver_installed overrides the labeler setting.
# When unset, it follows gpu_operator_preinstalled_nvidia_software (default true).
# Still disabled automatically when the PodMonitor CRD is absent.
nvsentinel_pod_monitor: true
nvsentinel_chart: "oci://ghcr.io/nvidia/nvsentinel"
nvsentinel_chart_version: "v1.27.0"
nvsentinel_release_name: nvsentinel
nvsentinel_namespace: nvsentinel
nvsentinel_helm_timeout: "10m"
nvsentinel_config_dir: /var/lib/deepops/nvsentinel
nvsentinel_kubeconfig: /etc/kubernetes/admin.conf
nvsentinel_kubectl_binary: /usr/local/bin/kubectl
nvsentinel_helm_binary: /usr/local/bin/helm
nvsentinel_cert_manager_chart_version: "v1.21.1"
nvsentinel_cert_manager_min_minor: 21
nvsentinel_cert_manager_namespace: cert-manager
nvsentinel_cert_manager_helm_repo: "https://charts.jetstack.io"
nvsentinel_storage_class: local-path
