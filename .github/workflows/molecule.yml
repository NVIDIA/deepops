---
name: test ansible roles with molecule
on:
  - push
  - pull_request
jobs:
  nvsentinel-render:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: set up helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.1"
      - name: install render dependencies
        run: python3 -m pip install Jinja2==3.1.6 PyYAML==6.0.2
      - name: pull pinned NVSentinel chart
        run: |
          mkdir -p "${RUNNER_TEMP}/nvsentinel-chart"
          helm pull oci://ghcr.io/nvidia/nvsentinel --version v1.27.0 \
            --destination "${RUNNER_TEMP}/nvsentinel-chart"
      - name: check offline renders
        env:
          NVSENTINEL_CHART: "${{ runner.temp }}/nvsentinel-chart/nvsentinel-v1.27.0.tgz"
        run: scripts/nvsentinel/render-check.sh
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deepops-role:
          - cachefilesd
          - facts
          - kerberos_client
          - lmod
          - nfs
          - nhc
          - nvidia_dcgm
          - openmpi
          - mofed
          - spack
          # Excluded from Docker CI (require systemd services that can't
          # run in containers): nis_client, rsyslog_client, rsyslog_server,
          # slurm. Tested end-to-end on real MAAS VMs instead.
          # Also excluded: singularity_wrapper (broken upstream Galaxy dep)
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          path: "${{ github.repository }}"
      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible==10.7.0 passlib
          python3 -m pip install molecule molecule-plugins[docker] docker
      - name: run molecule test
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/${{ github.repository }}/roles/galaxy:${{ github.workspace }}/${{ github.repository }}/roles"
        run: |
          cd "${{ github.repository }}/roles"
          ansible-galaxy role install --force -r ./requirements.yml
          ansible-galaxy collection install --force -r ./requirements.yml
          cd "${{ matrix.deepops-role }}"
          molecule test
